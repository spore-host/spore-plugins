name: globus-personal-endpoint
version: v1.1.0
description: "Install Globus Connect Personal for high-speed data transfer"
author: spore-host
license: Apache-2.0

# This plugin registers a new Globus Connect Personal mapped collection on the
# CONTROLLER (where globus-cli is logged in), captures its setup key, and pushes
# it to the instance to configure and start Globus Connect Personal there. A new
# endpoint is created per install and deleted on remove/terminate.
#
# One-time setup on the controller:
#   1. Install globus-cli:  pip install globus-cli   (or pipx install globus-cli)
#   2. Log in:              globus login
#      Opens a browser to authenticate; use `globus login --no-local-server` on a
#      headless controller. Verify with `globus whoami`.

config:
  display_name:
    type: string
    required: false
    default: "spore-endpoint"
    description: "Display name for the Globus endpoint"

conditions:
  local:
    - type: command
      run: globus whoami
      message: "globus-cli must be installed and logged in — run 'pip install globus-cli' then 'globus login' (see 'globus whoami')"
  remote:
    - type: platform
      os: linux
      message: "Globus plugin requires a Linux instance"

local:
  provision:
    # Create the endpoint on the controller (where globus-cli is logged in) and
    # capture its id + setup key from the JSON output. The field names come from
    # the `endpoint_create_result` payload: top-level `id` and
    # `globus_connect_setup_key`.
    - type: run
      run: |
        globus gcp create mapped "{{ config.display_name }}" --format json
      capture:
        endpoint_id: id
        setup_key: globus_connect_setup_key
    # Push the captured setup key to the instance so the remote setup step can
    # read it via {{ pushed.setup_key }}.
    - type: push
      key: setup_key
      value: "{{ outputs.setup_key }}"

  deprovision:
    # `globus endpoint delete` takes no confirmation flag.
    - type: run
      run: |
        globus endpoint delete {{ outputs.endpoint_id }} 2>/dev/null || true

remote:
  install:
    - type: run
      run: |
        set -eu
        cd /tmp
        # The Linux tarball is architecture-independent (works on x86_64 and
        # aarch64) and extracts to a versioned globusconnectpersonal-x.y.z/ dir.
        curl -fsSL -o gcp.tgz "https://downloads.globus.org/globus-connect-personal/linux/stable/globusconnectpersonal-latest.tgz"
        rm -rf /opt/globus-connect-personal
        mkdir -p /opt/globus-connect-personal
        tar xzf gcp.tgz -C /opt/globus-connect-personal --strip-components=1
        rm -f gcp.tgz
        ln -sf /opt/globus-connect-personal/globusconnectpersonal /usr/local/bin/globusconnectpersonal

  configure:
    - type: run
      run: |
        globusconnectpersonal -setup {{ pushed.setup_key }}

  start:
    - type: run
      run: |
        globusconnectpersonal -start &
        sleep 3
      background: false

  health:
    interval: 30s
    steps:
      - type: run
        run: globusconnectpersonal -status

  stop:
    - type: run
      run: globusconnectpersonal -stop

outputs:
  endpoint_id:
    description: "Globus endpoint UUID"
