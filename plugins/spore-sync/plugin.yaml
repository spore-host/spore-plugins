name: spore-sync
version: v1.2.0
description: "Live bidirectional directory sync between local machine and instance using mutagen"
author: spore-host
license: Apache-2.0

permissions:
  controller:
    network: true # mutagen connects to the instance over SSH to sync
    commands:
      - mutagen
  instance:
    root: true # installs rsync via the system package manager
    network: false # no outbound network from the instance side

config:
  local_path:
    type: string
    required: true
    description: "Local directory to sync"
  remote_path:
    type: string
    required: false
    default: "/home/ec2-user/sync"
    description: "Remote directory to sync to"
  mode:
    type: string
    required: false
    default: "two-way-safe"
    description: "Sync mode: two-way-safe, two-way-resolved, one-way-safe, one-way-replica"

conditions:
  local:
    - type: command
      run: mutagen version
      message: "mutagen must be installed locally (https://mutagen.io/documentation/introduction/installation)"
  remote:
    - type: platform
      os: linux
      message: "spore-sync requires a Linux instance"

local:
  provision:
    - type: run
      run: |
        mutagen sync create \
          --name spore-{{ instance.name }} \
          --sync-mode {{ config.mode }} \
          {{ config.local_path }} \
          ec2-user@{{ instance.ip }}:{{ config.remote_path }}

  deprovision:
    - type: run
      run: |
        mutagen sync terminate spore-{{ instance.name }} 2>/dev/null || true

  # Re-point the sync after the instance's IP changes (e.g. a stop/start). The
  # old session is pinned to the previous address and can't follow the change,
  # so tear it down and recreate it against the new {{ instance.ip }}.
  reconcile:
    - type: run
      run: |
        mutagen sync terminate spore-{{ instance.name }} 2>/dev/null || true
        mutagen sync create \
          --name spore-{{ instance.name }} \
          --sync-mode {{ config.mode }} \
          {{ config.local_path }} \
          ec2-user@{{ instance.ip }}:{{ config.remote_path }}

remote:
  install:
    - type: run
      run: |
        dnf install -y rsync || apt-get install -y rsync
    - type: run
      run: |
        mkdir -p {{ config.remote_path }}

  health:
    interval: 30s
    steps:
      - type: run
        run: test -d {{ config.remote_path }}
