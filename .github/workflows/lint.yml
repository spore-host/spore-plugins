name: Lint plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Static validation only — downloads the released `spawn` binary and runs
# `spawn plugin validate` on every plugin.yaml. No AWS, no instances. The
# validator is the single source of truth (spawn/pkg/plugin), so this CI never
# reimplements spec rules.
jobs:
  # Reads two files; deliberately its OWN job rather than a step in `validate`. A
  # broken pin should be reported in seconds, without depending on a spawn
  # release download first. (#19)
  ci-hygiene:
    name: CI hygiene (action pins + Dependabot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert actions are pinned and Dependabot bumps them
        run: bash tests/ci-hygiene.sh

      # The half that needs the network, so it can't live in the hermetic check
      # above: does each pin's `# vX.Y.Z` actually name the tag its SHA carries?
      # A wrong label is worse than none — it makes a major-version jump read as a
      # routine same-line bump, which is how a checkout v6 -> v7.0.1 bump nearly
      # landed in nf-spawn labelled `# v6`. Matters more here than most: release.yml
      # signs plugin manifests with cosign under this repo's OIDC identity, so a
      # mislabelled pin there misrepresents what did the signing. Read-only
      # (git ls-remote), no auth.
      - name: Verify pin comments match their SHAs
        run: ./scripts/verify-pins.sh

  validate:
    name: Validate plugin specs
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not `@v6`: a tag is mutable, and actions/checkout@v6
      # really did move (df4cb1c -> d23441a) with no signal to consumers.
      # Dependabot bumps this pin (.github/dependabot.yml) so it stays current
      # without being mutable; the ci-hygiene job keeps both true. (#19)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest spawn
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: amd64
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/spore-host/spawn/releases/latest"
          tag=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$api" | jq -r .tag_name)
          ver=${tag#v}
          asset="spawn_${ver}_linux_${ARCH}.tar.gz"
          url="https://github.com/spore-host/spawn/releases/download/${tag}/${asset}"
          echo "Using spawn ${tag} (${asset})"
          curl -fsSL -o /tmp/spawn.tgz "$url"
          tar -xzf /tmp/spawn.tgz -C /tmp spawn
          /tmp/spawn version || true

      - name: Validate all plugins
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(plugins/*/plugin.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "::error::no plugin.yaml files found under plugins/"
            exit 1
          fi
          # Prefer the publish-time strict check (permissions/step consistency,
          # spore-plugins#8), which requires a spawn new enough to have --strict.
          # Fall back to plain validate on an older released spawn so CI doesn't
          # break in the window before that spawn release ships.
          if /tmp/spawn plugin validate --help 2>&1 | grep -q -- --strict; then
            echo "Using strict validation (permissions/step consistency)"
            /tmp/spawn plugin validate --strict "${specs[@]}"
          else
            echo "::warning::downloaded spawn lacks --strict; running plain validation (upgrade once spawn with --strict is released)"
            /tmp/spawn plugin validate "${specs[@]}"
          fi
