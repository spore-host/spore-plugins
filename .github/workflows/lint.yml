name: Lint plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Static validation only — downloads the released `spawn` binary and runs
# `spawn plugin validate` on every plugin.yaml. No AWS, no instances. The
# validator is the single source of truth (spawn/pkg/plugin), so this CI never
# reimplements spec rules.
jobs:
  validate:
    name: Validate plugin specs
    # Self-hosted runner on orion.local (Apple M4 Pro, arm64). To fall back to
    # GitHub-hosted, change this to: runs-on: ubuntu-latest (and set ARCH=amd64).
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@v6

      - name: Download latest spawn
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: arm64
        run: |
          set -euo pipefail
          # Use the GitHub API via curl (gh CLI isn't installed on the runner).
          api="https://api.github.com/repos/spore-host/spawn/releases/latest"
          tag=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$api" | jq -r .tag_name)
          ver=${tag#v}
          asset="spawn_${ver}_linux_${ARCH}.tar.gz"
          url="https://github.com/spore-host/spawn/releases/download/${tag}/${asset}"
          echo "Using spawn ${tag} (${asset})"
          curl -fsSL -o /tmp/spawn.tgz "$url"
          tar -xzf /tmp/spawn.tgz -C /tmp spawn
          /tmp/spawn version || true

      - name: Validate all plugins
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(plugins/*/plugin.yaml)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "::error::no plugin.yaml files found under plugins/"
            exit 1
          fi
          /tmp/spawn plugin validate "${specs[@]}"
