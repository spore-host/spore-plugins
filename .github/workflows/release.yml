name: Release plugin

# Publishes a per-plugin GitHub Release with a checksum manifest, triggered by a
# tag of the form <plugin-name>-vX.Y.Z (e.g. tailscale-v1.2.0). The manifest
# (manifest.json) records the sha256 of the plugin's plugin.yaml; `spawn` fetches
# the plugin.yaml AT this tag and verifies it against the manifest asset when a
# user installs `name@vX.Y.Z`. The manifest is generated by `spawn plugin
# manifest` — the SAME binary that verifies it — so CI never reimplements the
# format. (Signing the manifest is a later increment; spore-plugins#8.)

on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create a release + upload assets

jobs:
  release:
    name: Publish plugin release
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@v6

      - name: Parse tag into plugin + version
        id: ref
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # <name>-vX.Y.Z → name = everything before the trailing -vX.Y.Z
          version="v${tag##*-v}"
          name="${tag%-v*}"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "name=$name"      >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing plugin '$name' version '$version' from tag '$tag'"

      - name: Verify the plugin exists and its version matches the tag
        env:
          NAME: ${{ steps.ref.outputs.name }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          dir="plugins/${NAME}"
          if [ ! -f "${dir}/plugin.yaml" ]; then
            echo "::error::no plugins/${NAME}/plugin.yaml for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          # The plugin.yaml's own version: must equal the tag's version, so the
          # released bytes and the tag can't disagree.
          spec_version=$(grep -E '^version:' "${dir}/plugin.yaml" | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'"'"']//g' | xargs)
          if [ "$spec_version" != "$VERSION" ]; then
            echo "::error::plugins/${NAME}/plugin.yaml version '${spec_version}' != tag version '${VERSION}'"
            exit 1
          fi

      - name: Download latest spawn
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: arm64
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/spore-host/spawn/releases/latest"
          tag=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$api" | jq -r .tag_name)
          ver=${tag#v}
          asset="spawn_${ver}_linux_${ARCH}.tar.gz"
          url="https://github.com/spore-host/spawn/releases/download/${tag}/${asset}"
          echo "Using spawn ${tag} (${asset})"
          curl -fsSL -o /tmp/spawn.tgz "$url"
          tar -xzf /tmp/spawn.tgz -C /tmp spawn

      - name: Validate and generate the manifest
        env:
          NAME: ${{ steps.ref.outputs.name }}
        run: |
          set -euo pipefail
          /tmp/spawn plugin validate "plugins/${NAME}/plugin.yaml"
          /tmp/spawn plugin manifest "plugins/${NAME}" -o manifest.json
          echo "::group::manifest.json"
          cat manifest.json
          echo "::endgroup::"

      - name: Create the release with the manifest asset
        # The orion runner has no `gh` CLI (see lint.yml), so use the REST API
        # directly with the workflow token.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          NAME: ${{ steps.ref.outputs.name }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          notes="Checksum manifest for \`${NAME}@${VERSION}\`. \`spawn\` verifies the fetched \`plugin.yaml\` against \`manifest.json\` on install."
          body=$(jq -n --arg tag "$TAG" --arg name "${NAME} ${VERSION}" --arg notes "$notes" \
            '{tag_name:$tag, name:$name, body:$notes}')
          resp=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases" -d "$body")
          upload_url=$(echo "$resp" | jq -r '.upload_url' | sed 's/{?name,label}//')
          echo "Uploading manifest.json to $upload_url"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${upload_url}?name=manifest.json" \
            --data-binary @manifest.json > /dev/null
          echo "Released ${TAG} with manifest.json"
