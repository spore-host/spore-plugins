name: Release plugin

# Publishes a per-plugin GitHub Release with a checksum manifest, triggered by a
# tag of the form <plugin-name>-vX.Y.Z (e.g. tailscale-v1.2.0). The manifest
# (manifest.json) records the sha256 of the plugin's plugin.yaml; `spawn` fetches
# the plugin.yaml AT this tag and verifies it against the manifest asset when a
# user installs `name@vX.Y.Z`. The manifest is generated by `spawn plugin
# manifest` — the SAME binary that verifies it — so CI never reimplements the
# format.
#
# The manifest is then signed KEYLESS with cosign (sigstore): this workflow's
# GitHub Actions OIDC identity is bound into a short-lived Fulcio certificate and
# the signature is logged to Rekor. `spawn` verifies that signature by default
# for official refs, pinning the cert identity to THIS repo + workflow, so only a
# manifest signed by this exact release job is trusted. (spore-plugins#8.)

on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create a release + upload assets
  id-token: write # keyless cosign signing (Fulcio OIDC)

jobs:
  release:
    name: Publish plugin release
    runs-on: [self-hosted, orion]
    steps:
      # Pinned to a commit SHA, not `@v6`: a tag is mutable, and actions/checkout@v6
      # really did move (df4cb1c -> d23441a) with no signal to consumers.
      # Dependabot bumps this pin (.github/dependabot.yml) so it stays current
      # without being mutable; the ci-hygiene job keeps both true. (#19)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Parse tag into plugin + version
        id: ref
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # <name>-vX.Y.Z → name = everything before the trailing -vX.Y.Z
          version="v${tag##*-v}"
          name="${tag%-v*}"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "name=$name"      >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing plugin '$name' version '$version' from tag '$tag'"

      - name: Verify the plugin exists and its version matches the tag
        env:
          NAME: ${{ steps.ref.outputs.name }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          dir="plugins/${NAME}"
          if [ ! -f "${dir}/plugin.yaml" ]; then
            echo "::error::no plugins/${NAME}/plugin.yaml for tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          # The plugin.yaml's own version: must equal the tag's version, so the
          # released bytes and the tag can't disagree.
          spec_version=$(grep -E '^version:' "${dir}/plugin.yaml" | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'"'"']//g' | xargs)
          if [ "$spec_version" != "$VERSION" ]; then
            echo "::error::plugins/${NAME}/plugin.yaml version '${spec_version}' != tag version '${VERSION}'"
            exit 1
          fi

      - name: Download latest spawn
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: arm64
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/spore-host/spawn/releases/latest"
          tag=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$api" | jq -r .tag_name)
          ver=${tag#v}
          asset="spawn_${ver}_linux_${ARCH}.tar.gz"
          url="https://github.com/spore-host/spawn/releases/download/${tag}/${asset}"
          echo "Using spawn ${tag} (${asset})"
          curl -fsSL -o /tmp/spawn.tgz "$url"
          tar -xzf /tmp/spawn.tgz -C /tmp spawn

      - name: Validate and generate the manifest
        env:
          NAME: ${{ steps.ref.outputs.name }}
        run: |
          set -euo pipefail
          /tmp/spawn plugin validate "plugins/${NAME}/plugin.yaml"
          /tmp/spawn plugin manifest "plugins/${NAME}" -o manifest.json
          echo "::group::manifest.json"
          cat manifest.json
          echo "::endgroup::"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the manifest (keyless)
        run: |
          set -euo pipefail
          # Keyless: cosign uses the ambient GitHub Actions OIDC token to obtain a
          # short-lived Fulcio cert, signs manifest.json, and records the entry in
          # Rekor. The bundle (cert + signature + log proof) is self-contained, so
          # spawn verifies it offline against the sigstore trust root.
          #
          # --new-bundle-format emits the Sigstore protobuf bundle (the format
          # sigstore-go — and thus spawn — parses). Without it, cosign writes the
          # LEGACY bundle ({base64Signature,cert,rekorBundle}), which spawn's
          # verifier can't load. The flag is "deprecated" only in the sense that
          # it will become the sole format in a future cosign; it is required here.
          COSIGN_EXPERIMENTAL=1 cosign sign-blob --yes \
            --new-bundle-format \
            --bundle manifest.json.sigstore.json \
            manifest.json
          echo "::group::manifest.json.sigstore.json"
          cat manifest.json.sigstore.json
          echo "::endgroup::"

      - name: Create the release with the manifest + signature assets
        # The orion runner has no `gh` CLI (see lint.yml), so use the REST API
        # directly with the workflow token.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          NAME: ${{ steps.ref.outputs.name }}
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          notes="Checksum manifest for \`${NAME}@${VERSION}\`, signed keyless with cosign. \`spawn\` verifies the fetched \`plugin.yaml\` against \`manifest.json\` and checks the \`manifest.json.sigstore.json\` signature on install."
          body=$(jq -n --arg tag "$TAG" --arg name "${NAME} ${VERSION}" --arg notes "$notes" \
            '{tag_name:$tag, name:$name, body:$notes}')
          resp=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases" -d "$body")
          upload_url=$(echo "$resp" | jq -r '.upload_url' | sed 's/{?name,label}//')
          for asset in manifest.json manifest.json.sigstore.json; do
            echo "Uploading ${asset} to ${upload_url}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "${upload_url}?name=${asset}" \
              --data-binary "@${asset}" > /dev/null
          done
          echo "Released ${TAG} with manifest.json + signature"
